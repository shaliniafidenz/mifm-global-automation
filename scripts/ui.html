<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appium Test Runner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#1e1e1e;
  --panel:#252526;
  --border:#3c3c3c;
  --text:#cccccc;
  --dim:#777;
  --accent:#0078d4;
  --accent-h:#106ebe;
  --green:#4ec9b0;
  --red:#f47d7d;
  --toolbar:#2d2d2d;
}

body.light{
  --bg:#f5f5f5;
  --panel:#ffffff;
  --border:#d4d4d4;
  --text:#1e1e1e;
  --dim:#888;
  --accent:#0078d4;
  --accent-h:#106ebe;
  --green:#0d7a5f;
  --red:#c0392b;
  --toolbar:#e8e8e8;
}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.5 'Segoe UI',system-ui,sans-serif}

/* ── Shell ── */
.app{display:flex;flex-direction:column;height:100vh}

.toolbar{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;
  background:var(--toolbar);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}

.pill{
  margin-left:auto;padding:3px 12px;border-radius:10px;
  font-size:11px;font-weight:600;letter-spacing:.03em;transition:background .2s,color .2s;
}
.pill-idle   {background:#2a2a2a;color:var(--dim)}
.pill-running{background:#0d3a5e;color:#4fc3f7}
.pill-pass   {background:#1a3d2b;color:var(--green)}
.pill-fail   {background:#3d1a1a;color:var(--red)}

.workspace{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ── */
.sidebar{
  width:300px;min-width:220px;
  display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--border);
  overflow:hidden;
}

.suites-hdr{
  display:flex;align-items:center;gap:8px;
  padding:10px 10px 5px 14px;flex-shrink:0;
}
.sec-label{
  font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--dim);
}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:6px}

.btn-run-all{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:4px;border:none;
  background:var(--accent);color:#fff;
  font-size:11px;font-weight:500;cursor:pointer;
  transition:background .12s;flex-shrink:0;
}
.btn-run-all:hover:not([disabled]){background:var(--accent-h)}
.btn-run-all[disabled]{opacity:.4;cursor:not-allowed}

.btn-hdr-stop{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:4px;border:none;
  background:#4a1010;color:#f88;
  font-size:11px;font-weight:500;cursor:pointer;
  transition:background .12s;flex-shrink:0;
}
.btn-hdr-stop:hover{background:#6a1010}

.theme-btn{
  margin-left:6px;
  width:28px;height:28px;border-radius:4px;border:none;
  background:transparent;color:var(--dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;flex-shrink:0;
}
.theme-btn:hover{background:rgba(128,128,128,.15);color:var(--text)}

/* ── Steps pane ── */
.steps-pane{
  width:270px;min-width:180px;
  display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--border);
  overflow:hidden;
  transition:width .18s ease,min-width .18s ease;
}
.steps-pane.collapsed{width:0!important;min-width:0!important;overflow:hidden;border-right:none}
.test-info.has-history{cursor:pointer}
.test-info.has-history:hover .tc-id{text-decoration:underline;color:var(--accent)}
.steps-hdr{
  display:flex;align-items:center;padding:7px 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.steps-test-info{
  padding:6px 8px 5px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;gap:4px;
  cursor:pointer;user-select:none;
}
.steps-test-info:hover{background:rgba(255,255,255,.04)}
.steps-tc-id{
  font:700 10.5px/1 'Cascadia Code','Consolas',monospace;color:var(--accent);
}
.steps-tc-title{
  font-size:11px;color:var(--dim);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.steps-placeholder{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:12px;
}
.steps-list{
  flex:1;overflow-y:auto;padding:3px 0;min-height:0;display:none;
}
.steps-list::-webkit-scrollbar{width:5px}
.steps-list::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
.step-row{
  display:flex;align-items:baseline;gap:6px;
  padding:3px 10px 3px 10px;
}
.step-row.step-fail{background:rgba(244,125,125,.07)}
.step-icon{
  width:13px;flex-shrink:0;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.step-icon.pass{color:var(--green)}
.step-icon.fail{color:var(--red)}
.step-label{font-size:11.5px;color:var(--text);flex-shrink:0;white-space:nowrap}
.step-info{
  font:10.5px/1.5 'Cascadia Code','Consolas',monospace;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
}
.step-err{
  padding:1px 10px 3px 29px;
  font:10.5px/1.4 'Cascadia Code','Consolas',monospace;
  color:var(--red);opacity:.85;
}
.steps-result{
  padding:6px 12px;border-top:1px solid var(--border);
  font-size:12px;font-weight:600;flex-shrink:0;display:none;
}
.steps-result.pass{color:var(--green)}
.steps-result.fail{color:var(--red)}

/* ── Tree ── */
.tree{flex:1;overflow-y:auto;padding:2px 5px 8px;min-height:0}
.tree::-webkit-scrollbar{width:5px}
.tree::-webkit-scrollbar-thumb{background:#444;border-radius:3px}

/* Each suite occupies a "group" */
.suite-group{margin-bottom:1px}

/* Suite row: .suite-expand (expand zone) + .suite-run-btn (play) — siblings */
.suite-row{
  display:flex;align-items:center;
  border-radius:4px;
}
.suite-row:hover{background:rgba(255,255,255,.06)}

.suite-expand{
  display:flex;align-items:center;gap:4px;
  flex:1;min-width:0;
  padding:5px 4px 5px 2px;
  cursor:pointer;user-select:none;
}

.chevron{
  width:18px;height:18px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--dim);transition:transform .18s ease;
}
.chevron.open{transform:rotate(90deg)}

.suite-name{
  font-size:13px;font-weight:500;
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.badge{
  font-size:10px;color:var(--dim);
  background:rgba(255,255,255,.08);
  padding:1px 6px;border-radius:7px;
  flex-shrink:0;
}

/* Play button on the suite row — always visible, distinct from expand area */
.suite-run-btn{
  width:26px;height:26px;flex-shrink:0;
  border:none;border-radius:4px;
  background:transparent;color:rgba(0,152,255,.7);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  margin-right:4px;
  transition:background .12s,color .12s;
}
.suite-run-btn:hover:not([disabled]){background:rgba(0,120,212,.2);color:#4fc3f7}
.suite-run-btn[disabled]{opacity:.35;cursor:not-allowed}

/* Test children */
.test-children{display:none;padding-bottom:2px}
.test-children.open{display:block}

/* Each test row: flex, play button is a sibling of .test-info */
.test-row{
  display:flex;align-items:center;gap:5px;
  padding:0 4px 0 10px;
  border-radius:4px;
}
.test-row:hover{background:rgba(255,255,255,.04)}

.test-info{
  display:flex;align-items:baseline;gap:7px;
  flex:1;min-width:0;
  padding:4px 4px 4px 0;
  cursor:default;
}
.tc-id{
  font:600 10.5px/1 'Cascadia Code','Consolas',monospace;
  color:var(--accent);flex-shrink:0;
}
.tc-name{
  font-size:11.5px;color:#aaa;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Play button on each test row */
.test-run-btn{
  width:22px;height:22px;flex-shrink:0;
  border:none;border-radius:50%;
  background:transparent;color:rgba(0,152,255,.6);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  margin-right:2px;
  transition:background .12s,color .12s;
  opacity:0;
}
.test-row:hover .test-run-btn{opacity:1}
.test-run-btn:hover:not([disabled]){background:rgba(0,120,212,.2);color:#4fc3f7}
.test-run-btn[disabled]{opacity:.3 !important;cursor:not-allowed}

/* Stop bar */
.stop-bar{
  padding:8px 10px;border-top:1px solid var(--border);
  flex-shrink:0;display:none;
}
.stop-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:6px;border-radius:4px;border:none;
  background:#4a1010;color:#f88;
  font-size:12px;font-weight:500;cursor:pointer;
  transition:background .12s;
}
.stop-btn:hover{background:#6a1010}

/* ── Output pane ── */
.output-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}

.out-hdr{
  display:flex;align-items:center;gap:2px;padding:0 10px;
  background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;
}
.out-tab{
  padding:8px 10px;border:none;border-bottom:2px solid transparent;
  background:transparent;color:var(--dim);
  font-size:11px;font-weight:500;cursor:pointer;
  transition:color .12s,border-color .12s;flex-shrink:0;
}
.out-tab:hover{color:var(--text)}
.out-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.clear-btn{
  margin-left:auto;background:none;border:none;
  color:var(--dim);cursor:pointer;font-size:11px;padding:3px 8px;border-radius:3px;
}
.clear-btn:hover{color:var(--text);background:rgba(255,255,255,.06)}

/* ── Results pane ── */
#resultsPane{flex:1;flex-direction:column;overflow:hidden}
.results-filter-bar{display:flex;gap:2px;padding:5px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.rfb{padding:2px 9px;border-radius:3px;border:none;background:transparent;color:var(--dim);font-size:10.5px;font-weight:500;cursor:pointer;transition:background .12s,color .12s}
.rfb:hover{background:rgba(255,255,255,.07);color:var(--text)}
.rfb.active{background:rgba(255,255,255,.1);color:var(--text)}
.rfb.pass.active{color:var(--green)}
.rfb.fail.active{color:var(--red)}
.results-list{flex:1;overflow-y:auto;padding:3px 0}
.results-list::-webkit-scrollbar{width:6px}
.results-list::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
.results-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);font-size:12px;padding:24px}
.result-row{display:flex;align-items:center;gap:8px;padding:5px 14px}
.result-row.clickable{cursor:pointer}
.result-row.clickable:hover{background:rgba(255,255,255,.04)}
.result-row.clickable:hover .result-tc-id{text-decoration:underline}
.result-status{width:14px;flex-shrink:0;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.result-status.pass{color:var(--green)}
.result-status.fail{color:var(--red)}
.result-tc-id{font:600 10.5px/1 'Cascadia Code','Consolas',monospace;color:var(--accent);flex-shrink:0}
.result-label{font-size:11.5px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.result-duration{font:10px/1 'Cascadia Code','Consolas',monospace;color:var(--dim);flex-shrink:0}

.log{
  flex:1;overflow-y:auto;padding:12px 18px;
  font:12px/1.65 'Cascadia Code','Consolas','Courier New',monospace;
  white-space:pre-wrap;word-break:break-all;
}
.log::-webkit-scrollbar{width:8px}
.log::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}
.log::-webkit-scrollbar-thumb:hover{background:#555}

.placeholder{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;
  color:var(--dim);gap:10px;font-family:'Segoe UI',sans-serif;
}
.placeholder svg{opacity:.22}
.placeholder h3{font-size:16px;color:#999;font-weight:500}
.placeholder p{font-size:13px}

/* ── Describe level ─────────────────────────────────────────────────────────── */
.desc-row{
  display:flex;align-items:center;
  border-radius:4px;padding-left:8px;
}
.desc-row:hover{background:rgba(255,255,255,.04)}
.desc-expand{
  display:flex;align-items:center;gap:4px;
  flex:1;min-width:0;
  padding:4px 4px 4px 2px;
  cursor:pointer;user-select:none;
}
.desc-name{
  font-size:12px;color:#aaa;
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.desc-status{
  width:14px;height:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
}
.desc-status.pass{color:var(--green)}
.desc-status.fail{color:var(--red)}
.desc-tests{padding-left:10px}

/* ── Steps filter bar ── */
.steps-filter-bar{display:flex;gap:2px;padding:4px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.sfb{
  padding:2px 9px;border-radius:3px;border:none;
  background:transparent;color:var(--dim);
  font-size:10.5px;font-weight:500;cursor:pointer;
  transition:background .12s,color .12s;
}
.sfb:hover{background:rgba(255,255,255,.07);color:var(--text)}
.sfb.active{background:rgba(255,255,255,.1);color:var(--text)}
.sfb.pass.active{color:var(--green)}
.sfb.fail.active{color:var(--red)}

/* ── Status indicators ── */
@keyframes spin{to{transform:rotate(360deg)}}

.spinner{
  width:12px;height:12px;flex-shrink:0;
  border:2px solid rgba(79,195,247,.18);
  border-top-color:#4fc3f7;
  border-radius:50%;
  animation:spin .65s linear infinite;
  display:inline-block;
}

/* Per-test status slot (left of play button) */
.tc-status{
  width:14px;height:14px;flex-shrink:0;
  display:none;align-items:center;justify-content:center;
  font-size:12px;line-height:1;font-weight:700;
}
.tc-status:not(:empty){display:flex}
.tc-status.pass{color:var(--green)}
.tc-status.fail{color:var(--red)}

/* Per-suite status slot (right of badge, inside expand zone) */
.suite-status{
  width:14px;height:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
}
.suite-status.pass{color:var(--green)}
.suite-status.fail{color:var(--red)}
</style>
</head>
<body>
<div class="app">

  <div class="toolbar">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0078d4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="10 8 16 12 10 16 10 8" fill="#0078d4" stroke="none"/>
      </svg>
      Appium Test Runner
    </div>
    <span class="pill pill-idle" id="pill">Idle</span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle dark / light mode"></button>
  </div>

  <div class="workspace">

    <aside class="sidebar">
      <div class="suites-hdr">
        <span class="sec-label">Suites</span>
        <div class="hdr-actions">
          <button class="btn-hdr-stop" id="btnHdrStop" onclick="stopRun()" style="display:none" title="Stop">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
            Stop
          </button>
          <button class="btn-run-all" id="btnRunAll" onclick="runAll()">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
            Run All
          </button>
        </div>
      </div>

      <div class="tree" id="tree"></div>

      <div class="stop-bar" id="stopBar">
        <button class="stop-btn" onclick="stopRun()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
          Stop
        </button>
      </div>
    </aside>

    <section class="steps-pane" id="stepsPane">
      <div class="steps-hdr">
        <span class="sec-label">Steps</span>
        <button class="theme-btn" id="btnCollapseSteps" onclick="toggleStepsPane()" title="Collapse steps panel" style="margin-left:auto">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <div id="stepsTestInfo" class="steps-test-info" style="display:none" onclick="toggleStepsBody()">
        <span class="chevron open" id="stepsBodyChevron"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        <div style="flex:1;min-width:0">
          <div class="steps-tc-id" id="stepsTcId"></div>
          <div class="steps-tc-title" id="stepsTcTitle"></div>
        </div>
      </div>
      <div class="steps-placeholder" id="stepsPlaceholder">No test running</div>
      <div id="stepsBody">
        <div class="steps-filter-bar" id="stepsFilterBar" style="display:none">
          <button class="sfb active" data-filter="all"  onclick="setStepsFilter('all')">All</button>
          <button class="sfb pass"   data-filter="pass" onclick="setStepsFilter('pass')">Passed</button>
          <button class="sfb fail"   data-filter="fail" onclick="setStepsFilter('fail')">Failed</button>
        </div>
        <div class="steps-list" id="stepsList"></div>
        <div class="steps-result" id="stepsResult"></div>
      </div>
    </section>

    <main class="output-pane">
      <div class="out-hdr">
        <button class="out-tab active" id="tabOutput"  onclick="switchOutTab('output')">Output</button>
        <button class="out-tab"        id="tabResults" onclick="switchOutTab('results')">Results</button>
        <button class="clear-btn" id="btnExpandSteps" onclick="toggleStepsPane()" style="display:none">&#8250; Steps</button>
        <button class="clear-btn" onclick="clearLog()">Clear</button>
      </div>

      <div id="resultsPane" style="display:none">
        <div class="results-filter-bar">
          <button class="rfb active" data-filter="all"  onclick="setResultsFilter('all')">All</button>
          <button class="rfb pass"   data-filter="pass" onclick="setResultsFilter('pass')">Passed</button>
          <button class="rfb fail"   data-filter="fail" onclick="setResultsFilter('fail')">Failed</button>
          <button class="rfb"        data-filter="skip" onclick="setResultsFilter('skip')">Skipped</button>
        </div>
        <div class="results-list" id="resultsList">
          <div class="results-empty">No results yet — run some tests</div>
        </div>
      </div>

      <div class="log" id="log">
        <div class="placeholder">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>
          </svg>
          <h3>No tests running</h3>
          <p>Press a play button to start</p>
        </div>
      </div>
    </main>

  </div>
</div>

<script>
var suites     = {};
var expanded     = {};       // { suiteName: boolean }
var descExpanded = {};       // { 'suiteName-descIdx': boolean }
var testStatus   = {};       // { suiteName: { tcId: 'idle'|'running'|'pass'|'fail' } }
var running    = false;
var es         = null;
var autoScroll = true;
var _reconnectAttempts = 0;
var _reconnectTimer    = null;
var _logBuffer  = '';
var _logRafId   = null;
var MAX_LOG_HTML = 400000; // ~400 KB of rendered HTML before trimming

// ── Helpers ───────────────────────────────────────────────────────────────────

var tcIndex = {}; // { tcId: { suiteName, label } } — built once after suites load

function buildTcIndex() {
    tcIndex = {};
    Object.keys(suites).forEach(function(name) {
        getAllTests(name).forEach(function(t) { tcIndex[t.id] = { suiteName: name, label: t.label }; });
    });
}

function fmtDur(ms) { return ms ? (ms / 1000).toFixed(1) + 's' : ''; }

function setActiveFilter(cls, f) {
    document.querySelectorAll(cls).forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-filter') === f);
    });
}

function openStepsPanel(tcId, label) {
    stepsBodyOpen = true;
    stepsFilter   = 'all';
    setActiveFilter('.sfb', 'all');
    document.getElementById('stepsBody').style.display        = '';
    document.getElementById('stepsBodyChevron').className     = 'chevron open';
    document.getElementById('stepsFilterBar').style.display   = 'flex';
    document.getElementById('stepsTestInfo').style.display    = 'flex';
    document.getElementById('stepsPlaceholder').style.display = 'none';
    document.getElementById('stepsList').style.display        = 'block';
    document.getElementById('stepsResult').style.display      = 'none';
    document.getElementById('stepsResult').className          = 'steps-result';
    document.getElementById('stepsTcId').textContent          = tcId;
    document.getElementById('stepsTcTitle').textContent       = label;
}

function markTestHasHistory(sName, tcId) {
    var el = document.querySelector('.test-info[data-suite="' + sName + '"][data-tc="' + tcId + '"]');
    if (!el || el.classList.contains('has-history')) return;
    el.classList.add('has-history');
    el.onclick = (function(s, id) { return function() { showTestSteps(s, id); }; })(sName, tcId);
}

function getTestsFromDesc(desc) {
    var result = [];
    if (!desc) return result;
    desc.tests.forEach(function(t) { result.push(t); });
    if (desc.describes) desc.describes.forEach(function(d) {
        getTestsFromDesc(d).forEach(function(t) { result.push(t); });
    });
    return result;
}

function getDescByPath(sName, path) {
    var s = suites[sName];
    if (!s) return null;
    var node = { describes: s.describes };
    for (var i = 0; i < path.length; i++) {
        if (!node.describes || !node.describes[path[i]]) return null;
        node = node.describes[path[i]];
    }
    return node;
}

function getAllTests(sName) {
    var result = [];
    var s = suites[sName];
    if (!s) return result;
    s.describes.forEach(function(d) { getTestsFromDesc(d).forEach(function(t) { result.push(t); }); });
    return result;
}

// ── Step state ────────────────────────────────────────────────────────────────
var steps              = [];   // live steps for the currently running test
var stepsAutoScroll    = true;
var stepsHistory       = {};   // { suiteName: { tcId: { steps, passed, duration } } }
var currentStepTcId    = '';
var currentStepSName   = null;
var stepsOpen          = true;
var stepsBodyOpen      = true;
var stepsFilter        = 'all';
var runResults         = [];   // [{ suiteName, tcId, label, status, duration }] — accumulates across runs
var resultsFilter      = 'all';

// ── Boot ─────────────────────────────────────────────────────────────────────

fetch('/api/suites').then(function(r){ return r.json(); }).then(function(data){
    suites = data;
    buildTcIndex();
    renderTree();
    // Reconnect if a run was already in progress (e.g. page refresh)
    return fetch('/api/status');
}).then(function(r){ return r.json(); }).then(function(s){
    if (s.running) { setRunning(true); connectStream(); }
}).catch(function(){});

// ── Tree render ───────────────────────────────────────────────────────────────

function renderTree() {
    var dis  = running ? ' disabled' : '';
    var html = '';

    Object.keys(suites).forEach(function(name) {
        var suite  = suites[name];
        var isOpen = !!expanded[name];
        var total  = getAllTests(name).length;

        html += '<div class="suite-group">';
        html += '<div class="suite-row">';

        // Expand zone: chevron + file icon + name + badge + suite status
        html += '<div class="suite-expand" onclick=\'toggleExpand(' + JSON.stringify(name) + ')\'>';
        html += '<span class="chevron' + (isOpen ? ' open' : '') + '">' + icoChevron() + '</span>';
        html += icoFile();
        html += '<span class="suite-name">' + name + '</span>';
        html += '<span class="badge">' + total + '</span>';
        html += '<span class="suite-status" id="ss-' + name + '">' + suiteStatusHtml(name) + '</span>';
        html += '</div>';

        // Suite play button
        html += '<button class="suite-run-btn" title="Run all ' + name + ' tests"'
            + dis + ' onclick=\'runSuite(' + JSON.stringify(name) + ')\'>'
            + icoPlay(11) + '</button>';

        html += '</div>'; // .suite-row

        // Describe children (recursive)
        html += '<div class="test-children' + (isOpen ? ' open' : '') + '">';
        suite.describes.forEach(function(desc, di) {
            html += renderDescNode(desc, name, [di], dis);
        });
        html += '</div>'; // .test-children (suite)

        html += '</div>'; // .suite-group
    });

    document.getElementById('tree').innerHTML = html;
}

function renderTestRow(t, suiteName, dis) {
    var hasHist   = !!(stepsHistory[suiteName] && stepsHistory[suiteName][t.id]);
    var infoClass = 'test-info' + (hasHist ? ' has-history' : '');
    var infoClick = hasHist
        ? ' onclick=\'showTestSteps(' + JSON.stringify(suiteName) + ',' + JSON.stringify(t.id) + ')\''
        : '';
    var html = '<div class="test-row">';
    html += '<div class="' + infoClass + '" data-suite="' + suiteName + '" data-tc="' + t.id + '"' + infoClick + '>';
    html += '<span class="tc-id">' + t.id + '</span>';
    html += '<span class="tc-name" title="' + t.label + '">' + t.label + '</span>';
    html += '</div>';
    html += '<span class="tc-status" id="ts-' + suiteName + '-' + t.id + '">'
        + tcStatusHtml(suiteName, t.id) + '</span>';
    html += '<button class="test-run-btn" title="Run ' + t.id + '"'
        + dis + ' onclick=\'runTest(' + JSON.stringify(suiteName) + ',' + JSON.stringify(t.id) + ')\'>'
        + icoPlay(10) + '</button>';
    html += '</div>';
    return html;
}

function renderDescNode(desc, suiteName, path, dis) {
    var dKey  = suiteName + '-' + path.join('-');
    var dOpen = !!descExpanded[dKey];
    var tests = getTestsFromDesc(desc);

    var html = '<div class="desc-row">';
    html += '<div class="desc-expand" onclick=\'toggleDescExpand('
        + JSON.stringify(suiteName) + ',' + JSON.stringify(path) + ')\'>';
    html += '<span class="chevron' + (dOpen ? ' open' : '') + '">' + icoChevron() + '</span>';
    html += icoDesc();
    html += '<span class="desc-name">' + escHtml(desc.name) + '</span>';
    html += '<span class="badge">' + tests.length + '</span>';
    html += '<span class="desc-status" id="ds-' + dKey + '">'
        + descStatusHtml(suiteName, path) + '</span>';
    html += '</div>';
    html += '<button class="suite-run-btn" title="Run ' + escHtml(desc.name) + '"'
        + dis + ' onclick=\'runDescribe(' + JSON.stringify(suiteName) + ',' + JSON.stringify(path) + ')\'>'
        + icoPlay(11) + '</button>';
    html += '</div>'; // .desc-row

    html += '<div class="test-children desc-tests' + (dOpen ? ' open' : '') + '">';
    if (desc.describes && desc.describes.length > 0) {
        desc.describes.forEach(function(sub, si) {
            html += renderDescNode(sub, suiteName, path.concat([si]), dis);
        });
    }
    desc.tests.forEach(function(t) { html += renderTestRow(t, suiteName, dis); });
    html += '</div>'; // .desc-tests

    return html;
}

// ── Status helpers ────────────────────────────────────────────────────────────

function tcStatusHtml(suiteName, tcId) {
    var s = testStatus[suiteName] && testStatus[suiteName][tcId];
    if (s === 'running') return '<span class="spinner"></span>';
    if (s === 'pass')    return '&#10003;'; // ✓
    if (s === 'fail')    return '&#10007;'; // ✗
    return '';
}

function suiteStatusHtml(name) {
    var st = testStatus[name];
    if (!st) return '';
    var hasRunning = false, hasFail = false, hasPass = false;
    Object.keys(st).forEach(function(id) {
        if (st[id] === 'running') hasRunning = true;
        if (st[id] === 'fail')    hasFail    = true;
        if (st[id] === 'pass')    hasPass    = true;
    });
    if (hasRunning) return '<span class="spinner"></span>';
    if (hasFail)    return '<span class="suite-status fail">&#10007;</span>';
    if (hasPass)    return '<span class="suite-status pass">&#10003;</span>';
    return '';
}

function descStatusHtml(sName, path) {
    var desc  = getDescByPath(sName, path);
    if (!desc) return '';
    var tests = getTestsFromDesc(desc);
    var st    = testStatus[sName];
    if (!st) return '';
    var hasRunning = false, hasFail = false, hasPass = false;
    tests.forEach(function(t) {
        var s = st[t.id];
        if (s === 'running') hasRunning = true;
        if (s === 'fail')    hasFail    = true;
        if (s === 'pass')    hasPass    = true;
    });
    if (hasRunning) return '<span class="spinner"></span>';
    if (hasFail)    return '<span class="desc-status fail">&#10007;</span>';
    if (hasPass)    return '<span class="desc-status pass">&#10003;</span>';
    return '';
}

// Set testStatus for the given payload before a run starts.
function resetStatus(payload) {
    // Reset everything to idle
    Object.keys(suites).forEach(function(name) {
        testStatus[name] = {};
        getAllTests(name).forEach(function(t) { testStatus[name][t.id] = 'idle'; });
    });

    // Mark the target tests as running
    if (payload.suite === 'all') {
        Object.keys(suites).forEach(function(name) {
            getAllTests(name).forEach(function(t) { testStatus[name][t.id] = 'running'; });
        });
    } else {
        var s = suites[payload.suite];
        if (s) {
            if (!payload.tests || payload.tests.length === 0) {
                getAllTests(payload.suite).forEach(function(t) { testStatus[payload.suite][t.id] = 'running'; });
            } else {
                payload.tests.forEach(function(id) { testStatus[payload.suite][id] = 'running'; });
            }
        }
    }
}

function updateDescIcons(sName, describes, pathPrefix) {
    if (!describes) return;
    describes.forEach(function(d, di) {
        var path = pathPrefix.concat([di]);
        var el   = document.getElementById('ds-' + sName + '-' + path.join('-'));
        if (el) el.innerHTML = descStatusHtml(sName, path);
        updateDescIcons(sName, d.describes, path);
    });
}

// Patch only the status icon elements — no full tree re-render so spinner never flickers.
function updateStatusIcons() {
    Object.keys(suites).forEach(function(name) {
        // Test icons
        getAllTests(name).forEach(function(t) {
            var el = document.getElementById('ts-' + name + '-' + t.id);
            if (!el) return;
            var s = testStatus[name] && testStatus[name][t.id];
            el.className = 'tc-status' + (s === 'pass' ? ' pass' : s === 'fail' ? ' fail' : '');
            el.innerHTML = s === 'running' ? '<span class="spinner"></span>'
                : s === 'pass' ? '&#10003;'
                : s === 'fail' ? '&#10007;'
                : '';
        });
        // Suite icon
        var sel = document.getElementById('ss-' + name);
        if (sel) sel.innerHTML = suiteStatusHtml(name);
        // Describe icons (recursive)
        var s = suites[name];
        if (s) updateDescIcons(name, s.describes, []);
    });
}

// Parse a raw output chunk for ✓ / ✗ markers next to TC IDs.
function parseForResults(raw) {
    var plain = raw.replace(/\x1b\[[0-9;]*[A-Za-z]/g, '');
    var lines = plain.split('\n');
    var changed = false;

    lines.forEach(function(line) {
        var m = line.match(/TC_([A-Z]+)_(\d+)/);
        if (!m) return;
        var tcId  = 'TC_' + m[1] + '_' + m[2];
        var entry = tcIndex[tcId];
        var sName = entry && entry.suiteName;
        if (!sName || !testStatus[sName] || testStatus[sName][tcId] !== 'running') return;

        var status = null;
        // ✓ U+2713, ✔ U+2714 = pass  |  ✗ U+2717, ✖ U+2716, ✘ U+2718 = fail
        if (/[✓✔]/.test(line)) {
            testStatus[sName][tcId] = 'pass';
            status = 'pass';
            changed = true;
        } else if (/[✗✖✘]/.test(line)) {
            testStatus[sName][tcId] = 'fail';
            status = 'fail';
            changed = true;
        }

        if (status) {
            var _label = (tcIndex[tcId] || {}).label || '';
            var _idx = -1;
            for (var ri = 0; ri < runResults.length; ri++) {
                if (runResults[ri].tcId === tcId) { _idx = ri; break; }
            }
            var _entry = { suiteName: sName, tcId: tcId, label: _label, status: status, duration: null };
            if (_idx >= 0) runResults[_idx] = _entry; else runResults.push(_entry);
        }
    });

    if (changed) {
        updateStatusIcons();
        renderResults();
    }
}

// ── Expand / collapse ─────────────────────────────────────────────────────────

function toggleExpand(name) {
    expanded[name] = !expanded[name];
    renderTree();
}

// ── Expand / collapse (describe) ──────────────────────────────────────────────

function toggleDescExpand(suiteName, path) {
    var key = suiteName + '-' + path.join('-');
    descExpanded[key] = !descExpanded[key];
    renderTree();
}

// ── Run actions ───────────────────────────────────────────────────────────────

function runDescribe(suiteName, path) {
    var desc  = getDescByPath(suiteName, path);
    if (!desc) return;
    var tests = getTestsFromDesc(desc);
    startRun({ suite: suiteName, tests: tests.map(function(t) { return t.id; }) });
}

function runAll() {
    startRun({ suite: 'all', tests: [] });
}

function runSuite(name) {
    startRun({ suite: name, tests: [] });
}

function runTest(suiteName, testId) {
    startRun({ suite: suiteName, tests: [testId] });
}

function startRun(payload) {
    if (running) return;
    clearLog(false);        // wipe log and reset testStatus first
    resetStatus(payload);   // mark targets as 'running'
    _reconnectAttempts = 0;
    if (_reconnectTimer) { clearTimeout(_reconnectTimer); _reconnectTimer = null; }
    setRunning(true);       // calls renderTree() — spinners now in testStatus

    fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
    }).then(function(r) {
        if (!r.ok) {
            return r.json().then(function(e){ throw new Error(e.error || 'Failed to start'); });
        }
        connectStream();
    }).catch(function(err) {
        appendText('\nError: ' + err.message + '\n');
        setRunning(false);
    });
}

function stopRun() {
    fetch('/api/stop', { method: 'POST' });
}

// ── SSE stream ────────────────────────────────────────────────────────────────

function connectStream() {
    if (es) { es.close(); es = null; }
    es = new EventSource('/api/stream');

    es.onmessage = function(e) {
        var msg = JSON.parse(e.data);
        if (msg.type === 'out') {
            appendText(msg.text);
        } else if (msg.type === 'step') {
            handleStep(msg.data);
        } else if (msg.type === 'done') {
            _reconnectAttempts = 0;
            if (_reconnectTimer) { clearTimeout(_reconnectTimer); _reconnectTimer = null; }
            // Any test still 'running' wasn't reported (stopped / skipped) → idle
            Object.keys(testStatus).forEach(function(name) {
                Object.keys(testStatus[name]).forEach(function(id) {
                    if (testStatus[name][id] === 'running') testStatus[name][id] = 'idle';
                });
            });
            updateStatusIcons();
            setRunning(false);
            es.close(); es = null;
            var pill = document.getElementById('pill');
            pill.className = 'pill ' + (msg.code === 0 ? 'pill-pass' : 'pill-fail');
            pill.textContent = msg.code === 0 ? 'Passed' : 'Failed';
            switchOutTab('results'); // show results summary when run is done
        } else if (msg.type === 'idle') {
            setRunning(false);
            es.close(); es = null;
        }
    };
    es.onerror = function() {
        if (es) { es.close(); es = null; }
        // Check if the run is still active on the server before giving up
        fetch('/api/status').then(function(r){ return r.json(); }).then(function(s){
            if (s.running && _reconnectAttempts < 6) {
                _reconnectAttempts++;
                var delay = Math.min(1000 * _reconnectAttempts, 5000);
                _reconnectTimer = setTimeout(connectStream, delay);
            } else {
                _reconnectAttempts = 0;
                setRunning(false);
            }
        }).catch(function(){ setRunning(false); });
    };
}

// ── Output ────────────────────────────────────────────────────────────────────

// Buffer chunks and flush once per animation frame to keep the main thread free.
function appendText(raw) {
    _logBuffer += raw;
    if (!_logRafId) _logRafId = requestAnimationFrame(_flushLog);
}

function _flushLog() {
    _logRafId = null;
    if (!_logBuffer) return;
    var chunk = _logBuffer;
    _logBuffer = '';

    parseForResults(chunk);

    var log = document.getElementById('log');
    var ph  = log.querySelector('.placeholder');
    if (ph) log.innerHTML = '';

    // Trim oldest content when the log gets too large
    if (log.innerHTML.length > MAX_LOG_HTML) {
        var trimmed = log.innerHTML.slice(-Math.floor(MAX_LOG_HTML * 0.6));
        var nl = trimmed.indexOf('\n');
        log.innerHTML = '<span style="color:var(--dim)">[earlier output trimmed]\n</span>'
            + trimmed.slice(nl >= 0 ? nl + 1 : 0);
    }

    var span = document.createElement('span');
    span.innerHTML = ansiToHtml(chunk);
    log.appendChild(span);
    if (autoScroll) log.scrollTop = log.scrollHeight;
}

// ── Results pane ─────────────────────────────────────────────────────────────

function switchOutTab(tab) {
    document.getElementById('tabOutput').classList.toggle('active',  tab === 'output');
    document.getElementById('tabResults').classList.toggle('active', tab === 'results');
    document.getElementById('log').style.display          = tab === 'output'  ? '' : 'none';
    document.getElementById('resultsPane').style.display  = tab === 'results' ? 'flex' : 'none';
}

function setResultsFilter(f) {
    resultsFilter = f;
    setActiveFilter('.rfb', f);
    renderResults();
}

function renderResults() {
    var list = document.getElementById('resultsList');
    if (!list) return;

    var filtered = resultsFilter === 'all'
        ? runResults
        : runResults.filter(function(r) { return r.status === resultsFilter; });

    if (filtered.length === 0) {
        list.innerHTML = '<div class="results-empty">'
            + (runResults.length === 0 ? 'No results yet — run some tests' : 'No ' + resultsFilter + ' results')
            + '</div>';
    } else {
        var html = '';
        filtered.forEach(function(r) {
            var icon = r.status === 'pass'
                ? '<span class="result-status pass">&#10003;</span>'
                : r.status === 'fail'
                    ? '<span class="result-status fail">&#10007;</span>'
                    : '<span class="result-status" style="color:var(--dim)">&#8901;</span>';
            var dur     = fmtDur(r.duration);
            var hasHist = !!(stepsHistory[r.suiteName] && stepsHistory[r.suiteName][r.tcId]);
            var click   = hasHist ? ' onclick=\'showTestSteps(' + JSON.stringify(r.suiteName) + ',' + JSON.stringify(r.tcId) + ')\'' : '';
            html += '<div class="result-row' + (hasHist ? ' clickable' : '') + '"' + click + '>';
            html += icon;
            html += '<span class="result-tc-id">' + r.tcId + '</span>';
            html += '<span class="result-label" title="' + escHtml(r.label) + '">' + escHtml(r.label) + '</span>';
            if (dur) html += '<span class="result-duration">' + dur + '</span>';
            html += '</div>';
        });
        list.innerHTML = html;
    }

    // Update tab counts
    var pass = 0, fail = 0, skip = 0;
    runResults.forEach(function(r) {
        if (r.status === 'pass') pass++;
        else if (r.status === 'fail') fail++;
        else if (r.status === 'skip') skip++;
    });
    var n = runResults.length;
    document.querySelectorAll('.rfb').forEach(function(b) {
        var f = b.getAttribute('data-filter');
        b.textContent = f === 'all'  ? (n    ? 'All '     + n    : 'All')
                      : f === 'pass' ? (pass ? 'Passed '  + pass : 'Passed')
                      : f === 'fail' ? (fail ? 'Failed '  + fail : 'Failed')
                      :                (skip ? 'Skipped ' + skip : 'Skipped');
    });
}

function clearLog(resetPill) {
    if (resetPill === undefined) resetPill = true;
    // Discard any buffered output that hasn't been flushed yet
    _logBuffer = '';
    if (_logRafId) { cancelAnimationFrame(_logRafId); _logRafId = null; }
    testStatus = {};
    if (resetPill) {
        stepsHistory  = {};
        runResults    = [];
        resultsFilter = 'all';
        setActiveFilter('.rfb', 'all');
        renderResults();
    }
    updateStatusIcons();
    clearSteps();
    document.getElementById('log').innerHTML =
        '<div class="placeholder">'
        + '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>'
        + '<h3>No tests running</h3><p>Press a play button to start</p></div>';
    if (resetPill) {
        var pill = document.getElementById('pill');
        pill.className = 'pill pill-idle';
        pill.textContent = 'Idle';
    }
}

document.getElementById('log').addEventListener('scroll', function() {
    autoScroll = (this.scrollTop + this.clientHeight) >= (this.scrollHeight - 30);
});

// ── Running state ─────────────────────────────────────────────────────────────

function setRunning(val) {
    running = val;
    document.getElementById('btnRunAll').disabled = val;
    document.getElementById('btnHdrStop').style.display = val ? 'flex' : 'none';
    document.getElementById('stopBar').style.display = val ? 'block' : 'none';
    if (val) {
        var pill = document.getElementById('pill');
        pill.className = 'pill pill-running';
        pill.textContent = 'Running...';
        switchOutTab('output'); // show live log while running
    }
    renderTree();
}

// ── ANSI → HTML ───────────────────────────────────────────────────────────────

function ansiToHtml(raw) {
    var FG = {
        '30':'#555','31':'#f47d7d','32':'#4ec9b0','33':'#dcdcaa',
        '34':'#569cd6','35':'#c586c0','36':'#9cdcfe','37':'#ccc',
        '90':'#767676','91':'#f48171','92':'#89d185','93':'#d7ba7d',
        '94':'#4fc1ff','95':'#dbb3f5','96':'#9cdcfe','97':'#fff',
    };
    var text = raw
        .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var open = 0;
    var result = text.replace(/\x1b\[([0-9;]*)([A-Za-z])/g, function(m, params, cmd) {
        if (cmd !== 'm') return '';
        var codes = params ? params.split(';') : ['0'];
        var out = '';
        for (var i = 0; i < codes.length; i++) {
            var n = parseInt(codes[i], 10) || 0;
            if (n === 0) {
                for (var c = 0; c < open; c++) out += '</span>';
                open = 0;
            } else if (n === 1) {
                out += '<span style="font-weight:bold">'; open++;
            } else if (n === 4) {
                out += '<span style="text-decoration:underline">'; open++;
            } else if (FG[String(n)]) {
                out += '<span style="color:' + FG[String(n)] + '">'; open++;
            }
        }
        return out;
    });
    for (var i = 0; i < open; i++) result += '</span>';
    return result;
}

// ── Steps panel ──────────────────────────────────────────────────────────────

function clearSteps() {
    steps = [];
    stepsBodyOpen = true;
    stepsFilter   = 'all';
    document.getElementById('stepsTestInfo').style.display = 'none';
    document.getElementById('stepsPlaceholder').style.display = 'flex';
    document.getElementById('stepsBody').style.display = '';
    document.getElementById('stepsBodyChevron').className = 'chevron open';
    document.getElementById('stepsFilterBar').style.display = 'none';
    document.getElementById('stepsList').style.display = 'none';
    document.getElementById('stepsList').innerHTML = '';
    var r = document.getElementById('stepsResult');
    r.style.display = 'none';
    r.className = 'steps-result';
    r.textContent = '';
}

function handleStep(data) {
    if (data.type === 'testStart') {
        steps = [];
        currentStepTcId  = data.tcId || '';
        var _e = tcIndex[currentStepTcId];
        currentStepSName = _e ? _e.suiteName : null;
        openStepsPanel(currentStepTcId, (data.title || '').replace(/^TC_[A-Z]+_\d+[:\s]*/,''));
        renderSteps();
        return;
    }
    if (data.type === 'cmdStart') {
        steps.push({ id: data.id, label: data.label || data.cmd, info: data.info || '', status: 'running', error: null });
        renderSteps();
        return;
    }
    if (data.type === 'cmdEnd') {
        var s = null;
        for (var i = steps.length - 1; i >= 0; i--) {
            if (steps[i].id === data.id) { s = steps[i]; break; }
        }
        if (s) { s.status = data.passed ? 'pass' : 'fail'; s.error = data.error || null; }
        renderSteps();
        return;
    }
    if (data.type === 'testEnd') {
        steps.forEach(function(s) { if (s.status === 'running') s.status = data.passed ? 'pass' : 'fail'; });
        renderSteps();

        if (currentStepTcId && currentStepSName) {
            if (!stepsHistory[currentStepSName]) stepsHistory[currentStepSName] = {};
            stepsHistory[currentStepSName][currentStepTcId] = {
                steps:    steps.map(function(s) { return { id:s.id, label:s.label, info:s.info, status:s.status, error:s.error }; }),
                passed:   data.passed,
                duration: data.duration,
            };
            var _label = (tcIndex[currentStepTcId] || {}).label || '';
            var _idx = -1;
            for (var ri = 0; ri < runResults.length; ri++) { if (runResults[ri].tcId === currentStepTcId) { _idx = ri; break; } }
            var _entry = { suiteName: currentStepSName, tcId: currentStepTcId, label: _label, status: data.passed ? 'pass' : 'fail', duration: data.duration };
            if (_idx >= 0) runResults[_idx] = _entry; else runResults.push(_entry);

            // Update the sidebar tree icon via the step channel (reliable path).
            // parseForResults also does this from terminal output but can miss when
            // stdout arrives in fragments — this guarantees the icon always updates.
            if (testStatus[currentStepSName]) {
                testStatus[currentStepSName][currentStepTcId] = data.passed ? 'pass' : 'fail';
            }
            updateStatusIcons();

            renderResults();
            markTestHasHistory(currentStepSName, currentStepTcId);
        }

        var el = document.getElementById('stepsResult');
        el.style.display = 'block';
        el.className = 'steps-result ' + (data.passed ? 'pass' : 'fail');
        var _dur = fmtDur(data.duration);
        el.textContent = (data.passed ? '✓ Passed' : '✗ Failed') + (_dur ? ' (' + _dur + ')' : '');
    }
}

function showTestSteps(suiteName, tcId) {
    var hist = stepsHistory[suiteName] && stepsHistory[suiteName][tcId];
    if (!hist) return;
    var label = (tcIndex[tcId] || {}).label || '';

    steps = hist.steps;
    openStepsPanel(tcId, label);
    renderSteps();

    var el = document.getElementById('stepsResult');
    el.style.display = 'block';
    el.className = 'steps-result ' + (hist.passed ? 'pass' : 'fail');
    var _dur = fmtDur(hist.duration);
    el.textContent = (hist.passed ? '✓ Passed' : '✗ Failed') + (_dur ? ' (' + _dur + ')' : '');

    if (!stepsOpen) toggleStepsPane();
}

function toggleStepsPane() {
    stepsOpen = !stepsOpen;
    document.getElementById('stepsPane').classList.toggle('collapsed', !stepsOpen);
    document.getElementById('btnCollapseSteps').style.display = stepsOpen ? '' : 'none';
    document.getElementById('btnExpandSteps').style.display  = stepsOpen ? 'none' : '';
}

function toggleStepsBody() {
    stepsBodyOpen = !stepsBodyOpen;
    document.getElementById('stepsBody').style.display = stepsBodyOpen ? '' : 'none';
    document.getElementById('stepsBodyChevron').className = 'chevron' + (stepsBodyOpen ? ' open' : '');
}

function setStepsFilter(f) {
    stepsFilter = f;
    setActiveFilter('.sfb', f);
    renderSteps();
}

function renderSteps() {
    var list    = document.getElementById('stepsList');
    var visible = stepsFilter === 'all'
        ? steps
        : steps.filter(function(s) { return s.status === stepsFilter; });
    var html = '';
    visible.forEach(function(s) {
        var icon = s.status === 'running'
            ? '<span class="step-icon"><span class="spinner" style="width:9px;height:9px;border-width:1.5px"></span></span>'
            : s.status === 'pass'
                ? '<span class="step-icon pass">✓</span>'
                : '<span class="step-icon fail">✗</span>';
        var rowCls = 'step-row' + (s.status === 'fail' ? ' step-fail' : '');
        html += '<div class="' + rowCls + '">' + icon
            + '<span class="step-label">' + escHtml(s.label) + '</span>'
            + (s.info ? '<span class="step-info">' + escHtml(s.info) + '</span>' : '')
            + '</div>';
        if (s.error) {
            html += '<div class="step-err">' + escHtml(s.error) + '</div>';
        }
    });
    list.innerHTML = html;
    if (stepsAutoScroll && stepsFilter === 'all') list.scrollTop = list.scrollHeight;

    // Update tab counts
    var pass = 0, fail = 0;
    steps.forEach(function(s) {
        if (s.status === 'pass') pass++;
        if (s.status === 'fail') fail++;
    });
    document.querySelectorAll('.sfb').forEach(function(b) {
        var f = b.getAttribute('data-filter');
        b.textContent = f === 'all'  ? (steps.length ? 'All '    + steps.length : 'All')
                      : f === 'pass' ? (pass          ? 'Passed ' + pass         : 'Passed')
                      :                (fail          ? 'Failed ' + fail         : 'Failed');
    });
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Icons ─────────────────────────────────────────────────────────────────────

function icoChevron() {
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
}
function icoFile() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8899bb" stroke-width="1.8" style="flex-shrink:0;margin-right:1px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
}
function icoDesc() {
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9988cc" stroke-width="1.8" style="flex-shrink:0;margin-right:2px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
}
function icoPlay(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>';
}
function icoSun() {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
}
function icoMoon() {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}
function toggleTheme() {
    var isLight = document.body.classList.toggle('light');
    localStorage.setItem('mozart-theme', isLight ? 'light' : 'dark');
    document.getElementById('themeBtn').innerHTML = isLight ? icoMoon() : icoSun();
}

// ── Theme init ────────────────────────────────────────────────────────────────
(function () {
    var saved = localStorage.getItem('mozart-theme');
    if (saved === 'light') document.body.classList.add('light');
    var btn = document.getElementById('themeBtn');
    if (btn) btn.innerHTML = (saved === 'light') ? icoMoon() : icoSun();
})();
</script>
